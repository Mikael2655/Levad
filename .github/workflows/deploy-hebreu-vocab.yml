# Publie les applications statiques du dépôt sur GitHub Pages.
#   • hebreu-vocab/  → à la racine du site (https://<user>.github.io/Levad/)
#   • belote/        → sous /belote/     (https://<user>.github.io/Levad/belote/)
# Le reste du dépôt (projet Next.js) n'est pas publié.
#
# Activation (une seule fois) : Settings → Pages → Source : "GitHub Actions"

name: Déployer les apps sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "hebreu-vocab/**"
      - "belote/**"
      - ".github/workflows/deploy-hebreu-vocab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le site (hébreu à la racine, belote dans /belote)
        run: |
          mkdir -p _site
          cp -r hebreu-vocab/. _site/
          mkdir -p _site/belote
          cp -r belote/. _site/belote/
      - uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages automatiquement si le compte le permet
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
