# Fabrique les programmes "double-clic" pour Windows et Mac à partir de releve-snmp/.
# Se lance tout seul à chaque modification du dossier releve-snmp, ou à la main
# (onglet Actions > "Programme de relevé LEVAD" > Run workflow).
name: Programme de relevé LEVAD

on:
  push:
    paths:
      - "releve-snmp/**"
      - ".github/workflows/build-releve-snmp.yml"
  workflow_dispatch:

jobs:
  fabriquer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
          - os: macos-latest
            nom: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer l'outil d'emballage
        run: python -m pip install pyinstaller
      - name: Fabriquer le programme
        run: python -m PyInstaller --onefile --name LEVAD-Releve releve-snmp/releve_snmp.py
      - name: Essai rapide (le programme démarre et gère une machine absente)
        shell: bash
        run: |
          if [ "${{ matrix.nom }}" = "Windows" ]; then EXE=dist/LEVAD-Releve.exe; else EXE=dist/LEVAD-Releve; fi
          "$EXE" 127.0.0.1 --delai 0.5 --dossier "$RUNNER_TEMP/essai" | tee essai.txt
          grep -q "Pas de réponse" essai.txt
      - name: Préparer le dossier à envoyer au client
        shell: bash
        run: |
          mkdir -p envoi/LEVAD-Releve
          if [ "${{ matrix.nom }}" = "Windows" ]; then
            cp dist/LEVAD-Releve.exe envoi/LEVAD-Releve/
            cp releve-snmp/client/LISEZ-MOI-Windows.txt envoi/LEVAD-Releve/
          else
            cp dist/LEVAD-Releve envoi/LEVAD-Releve/
            cp releve-snmp/client/Lancer-LEVAD.command envoi/LEVAD-Releve/
            cp releve-snmp/client/LISEZ-MOI-Mac.txt envoi/LEVAD-Releve/
            chmod +x envoi/LEVAD-Releve/LEVAD-Releve envoi/LEVAD-Releve/Lancer-LEVAD.command
            (cd envoi && zip -qr -X ../LEVAD-Releve-Mac.zip LEVAD-Releve)
          fi
      - name: Archive Windows (zip)
        if: matrix.nom == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path envoi/LEVAD-Releve -DestinationPath LEVAD-Releve-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LEVAD-Releve-${{ matrix.nom }}
          path: LEVAD-Releve-${{ matrix.nom }}.zip
          retention-days: 90
