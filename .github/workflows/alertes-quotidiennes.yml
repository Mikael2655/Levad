# Déclenche le mail récapitulatif des alertes d'encre (voir src/app/api/cron/alertes/route.ts).
# GitHub lance cette tâche à 15 h, 16 h et 17 h (UTC) : selon l'heure d'été ou d'hiver, l'une d'elles tombe
# à 17 h, heure de Paris ; le serveur n'envoie que dans la plage 17 h - 19 h et au plus une fois par jour.
# Nécessite le secret GitHub CRON_SECRET (la même valeur que la variable CRON_SECRET de Vercel).
name: Alertes d'encre (mail quotidien)

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Envoyer maintenant, sans attendre 17 h (essai)"
        type: boolean
        default: false

jobs:
  alertes:
    runs-on: ubuntu-latest
    steps:
      - name: Demander l'envoi du mail récapitulatif
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Le secret CRON_SECRET n'est pas configuré dans GitHub"; exit 1; fi
          URL="https://social.levad.fr/api/cron/alertes"
          if [ "$FORCE" = "true" ]; then URL="$URL?force=1"; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$URL"
