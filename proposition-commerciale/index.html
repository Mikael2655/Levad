<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LEVAD — Simulateur</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Simulateur">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
        <rect x="1" y="1" width="46" height="46" rx="10" fill="#8C9D8D"/>
        <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="12,14 22,24 12,34"/>
          <polyline points="22,14 32,24 22,34"/>
        </g>
      </svg>
      <span class="logo-word">LEVAD</span>
      <span class="logo-sub">Simulateur</span>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle" class="icon-btn" title="Mode clair / sombre" aria-label="Mode clair / sombre">🌙</button>
    </div>
  </header>

  <main id="screen"></main>

  <footer class="footer">
    Simulateur SA/SP &amp; générateur de proposition — fonctionne hors-ligne, aucune donnée envoyée.
  </footer>

  <!-- Librairies locales (offline) -->
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <!-- Application -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/export-excel.js"></script>
  <script src="js/export-pptx.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return; reloaded = true; location.reload();
      });
    }
  </script>
</body>
</html>
