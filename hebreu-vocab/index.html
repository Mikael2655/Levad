<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עברית — Mon vocabulaire hébreu</title>
  <!-- Pour l'iPhone : icône et affichage en "vraie app" depuis l'écran d'accueil -->
  <meta name="theme-color" content="#0038b8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hébreu">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- Police hébraïque lisible + police ronde « fun » (repli système hors ligne) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS (thème assorti, reset désactivé pour ne rien casser) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: "#0038b8", dark: "#002a8c", gold: "#e3a92a" },
          },
          fontFamily: {
            sans: ["Nunito", "system-ui", "sans-serif"],
            head: ["Fredoka", "Nunito", "sans-serif"],
          },
          borderRadius: { xl: "18px", "2xl": "24px" },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="tb-left">
      <h1 class="logo" data-action="home" role="button" tabindex="0">
        <span class="logo-he" dir="rtl">עִבְרִית</span>
        <span class="logo-fr">Mon hébreu</span>
      </h1>
    </div>
    <div class="tb-mid" aria-hidden="true">
      <svg class="magen" viewBox="0 0 100 100" role="img" aria-label="Étoile de David">
        <polygon points="50,6 12,71 88,71" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"></polygon>
        <polygon points="50,94 12,29 88,29" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"></polygon>
      </svg>
    </div>
    <div class="tb-right">
      <div class="topbar-right">
        <div class="tr-icons">
          <button id="search-btn" class="icon-btn" title="Rechercher" aria-label="Rechercher">🔍</button>
          <button id="theme-toggle" class="icon-btn" title="Mode clair / sombre" aria-label="Mode clair / sombre">🌙</button>
        </div>
        <button id="profile-chip" class="profile-chip" title="Changer de profil"></button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="home">🏠 Accueil</button>
    <button class="tab" data-view="jeux">🎮 Jeux</button>
    <button class="tab" data-view="nouveaute">🆕 Nouveauté</button>
    <button class="tab" data-view="tables">📖 Verbes</button>
    <button class="tab" data-view="progress">📊 Progrès</button>
  </nav>

  <!-- Chaque "vue" (écran) de l'application est rendue ici par app.js -->
  <main id="screen"></main>

  <footer class="footer">
    Ajoutez vos mots dans <code>js/vocab.js</code> et vos verbes dans <code>js/verbes.js</code> — בהצלחה ! (bonne chance !)
  </footer>

  <script src="js/vocab.js"></script>
  <script src="js/verbes.js"></script>
  <script src="js/niqqud.js"></script>
  <script src="js/combine-phrases.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Copie hors-ligne de l'app (service worker) — voir sw.js
    // On vérifie activement les mises à jour et, dès qu'une nouvelle
    // version prend la main, on recharge la page une fois : l'app se
    // met donc à jour toute seule sans vidage de cache manuel.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .then((reg) => {
          reg.update();
          // Vérifie une mise à jour à chaque retour sur l'app
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") reg.update();
          });
        })
        .catch(() => {});
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
