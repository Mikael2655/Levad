<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>♠ Tournoi de belote</title>
  <meta name="theme-color" content="#15321f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tournoi belote">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo" data-nav="#/">
      <span class="logo-suit">♠</span> Tournoi belote
    </h1>
    <div class="topbar-right">
      <span id="mode-chip" class="chip" hidden></span>
      <button id="theme-toggle" class="icon-btn" title="Mode clair / sombre" aria-label="Mode clair / sombre">🌙</button>
    </div>
  </header>

  <main id="screen"><div class="loading">Chargement…</div></main>

  <footer class="foot">
    <span id="foot-info"></span>
  </footer>

  <!-- Firebase (chargé depuis le CDN Google ; ignoré en mode démo) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
